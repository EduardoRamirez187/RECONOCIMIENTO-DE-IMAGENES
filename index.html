<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREDICCIÓN</title>
    <style>
        body {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            height: 100vh;
            background: url('static/ROBOT.PNG') no-repeat center center/cover;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1e7e34;
        }
        #video-container {
            display: none;
            margin-top: 10px;
        }
        #video-stream {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Identificación de Frutas en Tiempo Real</h2>
        <button onclick="startDetection()">Iniciar Detección</button>

        <div id="video-container">
            <h3>Detección en Vivo</h3>
            <img id="video-stream" src="/deteccion" alt="Video en tiempo real">
        </div>
    </div>

    <script>
        function startDetection() {
            document.getElementById("video-container").style.display = "block";
        }
    </script>
</body>
</html>
